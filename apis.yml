aid: watsi
name: Watsi
description: Watsi is a San Francisco-based 501(c)(3) nonprofit crowdfunding platform
  that lets donors directly fund surgeries and medical care for patients in low-income
  countries, working through vetted medical partners across Africa, Asia, and Latin
  America. Founded in 2011 and the first nonprofit funded by Y Combinator, Watsi has
  directed more than $20 million to patient healthcare. Watsi previously published
  a read-only JSON API at developers.watsi.org, but that developer portal and
  api.watsi.org no longer resolve, so no public API surface is currently available.
